<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CareConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Optional for stats -->
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">CareConnect Admin</a>
                <ul class="nav-links" id="nav-links"></ul>
            </nav>
        </div>
    </header>

    <div class="container mt-2">
        <h1>Admin Overview</h1>

        <div class="grid-3 mt-1">
            <div class="card text-center">
                <h2>Total Donations</h2>
                <p style="font-size: 2em; color: var(--success)" id="total-donations">₹0</p>
            </div>
            <div class="card text-center">
                <h2>Total Bookings</h2>
                <p style="font-size: 2em; color: var(--primary)" id="total-bookings">0</p>
            </div>
        </div>

        <div class="mt-2">
            <h2>Pending Orphanage Approvals</h2>
            <div class="card" style="overflow-x: auto;">
                <table id="pending-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Location</th>
                            <th>Docs/Desc</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        if (!State.isLoggedIn() || State.user.role !== 'ADMIN') {
            window.location.href = 'login.html';
        }

        async function loadAdmin() {
            try {
                // Load Pending Orphanages
                const pending = await api.get('/admin/orphanages/pending');
                const tbody = document.getElementById('pending-table').querySelector('tbody');

                if (pending.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No pending approvals.</td></tr>';
                } else {
                    tbody.innerHTML = pending.map(o => `
                        <tr>
                            <td>${o.name}</td>
                            <td>${o.location}</td>
                            <td>${o.description.substring(0, 50)}...</td>
                            <td>
                                <button onclick="approve(${o.id})" class="btn btn-success" style="padding: 5px 10px;">Approve</button>
                            </td>
                        </tr>
                    `).join('');
                }

                // Load Stats
                const donations = await api.get('/admin/donations');
                const totalAmount = donations.reduce((sum, d) => sum + d.amount, 0);
                document.getElementById('total-donations').textContent = '₹' + totalAmount;

                const bookings = await api.get('/admin/bookings');
                document.getElementById('total-bookings').textContent = bookings.length;

            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function approve(id) {
            try {
                await api.put(`/admin/orphanages/${id}/approve`);
                showToast('Orphanage Approved', 'success');
                loadAdmin();
            } catch (e) { showToast(e.message, 'error'); }
        }

        loadAdmin();
    </script>
    <script src="js/chatbot.js"></script>
</body>

</html>
